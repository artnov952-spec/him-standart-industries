<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1080" viewBox="0 0 840 1080"><rect width="840" height="1080" fill="#fff"/><g font-family="Arial,sans-serif"><text x="64" y="78" font-size="26" fill="#171a15">HIM STANDART</text><text x="64" y="106" font-size="15" fill="#666d61">Industries</text><text x="64" y="170" font-size="19" fill="#666d61">Демонстрационный макет</text><text x="64" y="228" font-size="34" fill="#171a15">Паспорт качества</text><text x="64" y="266" font-size="18" fill="#4e534b">Сведения о продукте, партии и результатах контроля</text><path d="M64 300H776" stroke="#d8dcd4"/><text x="140" y="690" font-size="116" fill="#20271a" opacity=".045" transform="rotate(-26 420 600)">Образец</text><text x="64" y="352" font-size="22" fill="#171a15">Сведения о продукции и партии</text><text x="64" y="402" font-size="18" fill="#4e534b">Наименование</text><text x="360" y="402" font-size="18" fill="#4e534b">[название продукта]</text><text x="64" y="444" font-size="18" fill="#4e534b">Квалификация</text><text x="360" y="444" font-size="18" fill="#4e534b">[квалификация]</text><text x="64" y="486" font-size="18" fill="#4e534b">Производитель</text><text x="360" y="486" font-size="18" fill="#4e534b">[производитель]</text><text x="64" y="528" font-size="18" fill="#4e534b">Номер партии</text><text x="360" y="528" font-size="18" fill="#4e534b">[номер партии]</text><rect x="64" y="584" width="712" height="52" fill="#edf0e9"/><text x="80" y="617" font-size="18" fill="#171a15">Показатель</text><text x="400" y="617" font-size="18" fill="#171a15">Норма</text><text x="584" y="617" font-size="18" fill="#171a15">Результат</text><text x="80" y="680" font-size="17" fill="#4e534b">[показатель]</text><text x="400" y="680" font-size="17" fill="#4e534b">[требование]</text><text x="584" y="680" font-size="17" fill="#4e534b">[результат]</text><path d="M64 704H776" stroke="#d8dcd4"/><text x="80" y="748" font-size="17" fill="#4e534b">[показатель]</text><text x="400" y="748" font-size="17" fill="#4e534b">[требование]</text><text x="584" y="748" font-size="17" fill="#4e534b">[результат]</text><path d="M64 772H776" stroke="#d8dcd4"/><text x="80" y="816" font-size="17" fill="#4e534b">[показатель]</text><text x="400" y="816" font-size="17" fill="#4e534b">[требование]</text><text x="584" y="816" font-size="17" fill="#4e534b">[результат]</text><path d="M64 840H776" stroke="#d8dcd4"/><text x="64" y="918" font-size="16" fill="#4e534b">Показана только структура документа, без фактических результатов.</text><path d="M64 970H776" stroke="#d8dcd4"/><text x="64" y="1006" font-size="16" fill="#4e534b">Недействующий документ. Файлы предоставляет поставщик.</text><text x="64" y="1032" font-size="15" fill="#4e534b">Макет не подтверждает качество, сертификацию или разрешение.</text></g></svg>
