<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1080" viewBox="0 0 840 1080"><rect width="840" height="1080" fill="#fff"/><g font-family="Arial,sans-serif"><text x="64" y="78" font-size="26" fill="#171a15">HIM STANDART</text><text x="64" y="106" font-size="15" fill="#666d61">Industries</text><text x="64" y="170" font-size="19" fill="#666d61">Демонстрационный макет</text><text x="64" y="228" font-size="34" fill="#171a15">Паспорт безопасности</text><text x="64" y="266" font-size="18" fill="#4e534b">SDS · Пример структуры документа</text><path d="M64 300H776" stroke="#d8dcd4"/><text x="140" y="690" font-size="116" fill="#20271a" opacity=".045" transform="rotate(-26 420 600)">Образец</text><text x="64" y="354" font-size="22" fill="#171a15">1. Идентификация продукта</text><text x="64" y="394" font-size="17" fill="#4e534b">[Наименование, состав и сведения поставщика]</text><rect x="64" y="416" width="620" height="6" fill="#e5e9e1"/><rect x="64" y="436" width="516" height="6" fill="#e5e9e1"/><text x="64" y="494" font-size="22" fill="#171a15">2. Описание опасностей</text><text x="64" y="534" font-size="17" fill="#4e534b">[Классификация и меры предосторожности]</text><rect x="64" y="556" width="620" height="6" fill="#e5e9e1"/><rect x="64" y="576" width="516" height="6" fill="#e5e9e1"/><text x="64" y="634" font-size="22" fill="#171a15">7. Обращение и хранение</text><text x="64" y="674" font-size="17" fill="#4e534b">[Условия обращения и хранения]</text><rect x="64" y="696" width="620" height="6" fill="#e5e9e1"/><rect x="64" y="716" width="516" height="6" fill="#e5e9e1"/><text x="64" y="774" font-size="22" fill="#171a15">8. Средства защиты</text><text x="64" y="814" font-size="17" fill="#4e534b">[Меры контроля и индивидуальная защита]</text><rect x="64" y="836" width="620" height="6" fill="#e5e9e1"/><rect x="64" y="856" width="516" height="6" fill="#e5e9e1"/><text x="64" y="934" font-size="16" fill="#4e534b">Пример разделов SDS. Инструкции по веществу здесь не приводятся.</text><path d="M64 970H776" stroke="#d8dcd4"/><text x="64" y="1006" font-size="16" fill="#4e534b">Недействующий документ. Файлы предоставляет поставщик.</text><text x="64" y="1032" font-size="15" fill="#4e534b">Макет не подтверждает качество, сертификацию или разрешение.</text></g></svg>
