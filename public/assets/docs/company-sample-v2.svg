<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1080" viewBox="0 0 840 1080"><rect width="840" height="1080" fill="#fff"/><g font-family="Arial,sans-serif"><text x="64" y="78" font-size="26" fill="#171a15">HIM STANDART</text><text x="64" y="106" font-size="15" fill="#666d61">Industries</text><text x="64" y="170" font-size="19" fill="#666d61">Демонстрационный макет</text><text x="64" y="228" font-size="34" fill="#171a15">Документы компании</text><text x="64" y="266" font-size="18" fill="#4e534b">Место для подтвержденных файлов поставщика</text><path d="M64 300H776" stroke="#d8dcd4"/><text x="140" y="690" font-size="116" fill="#20271a" opacity=".045" transform="rotate(-26 420 600)">Образец</text><rect x="64" y="336" width="712" height="128" rx="8" fill="#f4f6f1" stroke="#dde2d6"/><text x="88" y="374" font-size="22" fill="#171a15">Реквизиты поставщика</text><text x="88" y="416" font-size="17" fill="#4e534b">[Подтвержденные сведения компании]</text><rect x="64" y="516" width="712" height="128" rx="8" fill="#f4f6f1" stroke="#dde2d6"/><text x="88" y="554" font-size="22" fill="#171a15">Регистрационные документы</text><text x="88" y="596" font-size="17" fill="#4e534b">[Файлы, предоставленные компанией]</text><rect x="64" y="696" width="712" height="128" rx="8" fill="#f4f6f1" stroke="#dde2d6"/><text x="88" y="734" font-size="22" fill="#171a15">Разрешительные документы</text><text x="88" y="776" font-size="17" fill="#4e534b">[При необходимости для конкретной поставки]</text><text x="64" y="934" font-size="16" fill="#4e534b">Наличие и состав подтверждающих файлов согласуются отдельно.</text><path d="M64 970H776" stroke="#d8dcd4"/><text x="64" y="1006" font-size="16" fill="#4e534b">Недействующий документ. Файлы предоставляет поставщик.</text><text x="64" y="1032" font-size="15" fill="#4e534b">Макет не подтверждает качество, сертификацию или разрешение.</text></g></svg>
